# Render Blueprint: free-tier deployment (one container, see infra/render/Dockerfile).
#
# Free-tier trade-offs, accepted for a trial deployment:
#  * The free database expires 30 days after creation, with its data.
#  * The service sleeps when idle; queued jobs run only while it's awake.
#  * No tool sandbox (needs NET_ADMIN): Nuclei runs are refused. Passive collection and
#    technology identification work.
#  * Evidence content is stored in Postgres (no persistent disk on free services).
#
# Secrets: database passwords and the app key are generated by Render. The first owner's
# email and password are entered once (sync: false); remove NIGHTFALL_ADMIN_PASSWORD
# after the first successful start.
databases:
  - name: nightfall-db-test
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    databaseName: nightfall_db_test
    user: nightfall_db_test_user
    ipAllowList: []  # no access from outside Render

services:
  - type: web
    name: nightfall
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./infra/render/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DB_HOST
        fromDatabase: { name: nightfall-db-test, property: host }
      - key: DB_PORT
        fromDatabase: { name: nightfall-db-test, property: port }
      - key: DB_NAME
        fromDatabase: { name: nightfall-db-test, property: database }
      - key: DB_USER
        fromDatabase: { name: nightfall-db-test, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: nightfall-db-test, property: password }
      - key: NIGHTFALL_APP_DB_PASSWORD
        generateValue: true
      - key: NIGHTFALL_WORKER_DB_PASSWORD
        generateValue: true
      - key: NIGHTFALL_SECRET_KEY
        generateValue: true
      - key: NIGHTFALL_BOOTSTRAP_WORKSPACE
        value: DRE Lab
      - key: NIGHTFALL_BOOTSTRAP_OWNER_NAME
        sync: false
      - key: NIGHTFALL_BOOTSTRAP_OWNER_EMAIL
        sync: false
      - key: NIGHTFALL_ADMIN_PASSWORD
        sync: false
