{
  "options": {
    "host_identifier": "hostname",
    "disable_distributed": true,
    "disable_extensions": true,
    "logger_plugin": "filesystem",
    "schedule_splay_percent": 10
  },
  "schedule": {
    "janus_accounts": {
      "query": "SELECT username, uid, shell, directory FROM users;",
      "interval": 600, "snapshot": true
    },
    "janus_admins": {
      "query": "SELECT u.username, g.groupname FROM user_groups ug JOIN users u ON u.uid = ug.uid JOIN groups g ON g.gid = ug.gid WHERE g.groupname IN ('sudo', 'wheel', 'admin', 'root', 'Administrators');",
      "interval": 600, "snapshot": true
    },
    "janus_ssh_keys": {
      "query": "SELECT u.username, ak.key_file, ak.algorithm, ak.key FROM users u CROSS JOIN authorized_keys ak USING (uid);",
      "interval": 600, "snapshot": true, "platform": "posix"
    },
    "janus_listeners": {
      "query": "SELECT DISTINCT p.name AS process, p.path, lp.address, lp.port, CASE lp.protocol WHEN 6 THEN 'tcp' WHEN 17 THEN 'udp' ELSE CAST(lp.protocol AS TEXT) END AS protocol FROM listening_ports lp LEFT JOIN processes p USING (pid) WHERE lp.port != 0 AND lp.address NOT LIKE '127.%' AND lp.address != '::1';",
      "interval": 600, "snapshot": true
    },
    "janus_persistence_linux": {
      "query": "SELECT 'systemd' AS kind, id AS name, fragment_path AS path, '' AS command FROM systemd_units WHERE unit_file_state = 'enabled' UNION ALL SELECT 'cron', path, path, command FROM crontab UNION ALL SELECT 'kernel_module', name, '', '' FROM kernel_modules;",
      "interval": 600, "snapshot": true, "platform": "linux"
    },
    "janus_persistence_windows": {
      "query": "SELECT 'service' AS kind, name, path, '' AS command FROM services WHERE start_type = 'AUTO_START' UNION ALL SELECT 'scheduled_task', name, path, action FROM scheduled_tasks WHERE enabled = 1 UNION ALL SELECT 'startup_item', name, path, args FROM startup_items;",
      "interval": 600, "snapshot": true, "platform": "windows"
    },
    "janus_software_deb": {
      "query": "SELECT name, version, 'deb' AS source FROM deb_packages;",
      "interval": 3600, "snapshot": true, "platform": "linux"
    },
    "janus_software_rpm": {
      "query": "SELECT name, version, 'rpm' AS source FROM rpm_packages;",
      "interval": 3600, "snapshot": true, "platform": "linux"
    },
    "janus_software_windows": {
      "query": "SELECT name, version, 'programs' AS source FROM programs;",
      "interval": 3600, "snapshot": true, "platform": "windows"
    },
    "janus_posture_linux": {
      "query": "SELECT 'disk_encryption' AS \"check\", CASE WHEN MAX(encrypted) = 1 THEN 1 ELSE 0 END AS ok, COUNT(*) || ' block device(s) checked; at least one encrypted: ' || CASE WHEN MAX(encrypted) = 1 THEN 'yes' ELSE 'no' END AS detail FROM disk_encryption UNION ALL SELECT 'firewall', CASE WHEN COUNT(*) > 0 THEN 1 ELSE NULL END, COUNT(*) || ' iptables rule(s); nftables rules are not visible to osquery' FROM iptables UNION ALL SELECT 'os_version', NULL, name || ' ' || version FROM os_version;",
      "interval": 600, "snapshot": true, "platform": "linux"
    },
    "janus_posture_windows": {
      "query": "SELECT 'firewall' AS \"check\", CASE WHEN firewall = 'Good' THEN 1 ELSE 0 END AS ok, firewall AS detail FROM windows_security_center UNION ALL SELECT 'automatic_updates', CASE WHEN autoupdate = 'Good' THEN 1 ELSE 0 END, autoupdate FROM windows_security_center UNION ALL SELECT 'antivirus', CASE WHEN antivirus = 'Good' THEN 1 ELSE 0 END, antivirus FROM windows_security_center UNION ALL SELECT 'disk_encryption', CASE WHEN COUNT(*) > 0 AND MIN(protection_status) = 1 THEN 1 ELSE 0 END, 'BitLocker: ' || COUNT(*) || ' volume(s), all protected: ' || CASE WHEN COUNT(*) > 0 AND MIN(protection_status) = 1 THEN 'yes' ELSE 'no' END FROM bitlocker_info UNION ALL SELECT 'os_version', NULL, name || ' ' || version FROM os_version;",
      "interval": 600, "snapshot": true, "platform": "windows"
    }
  }
}
