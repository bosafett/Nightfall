<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>BLACKSITE · JANUS</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="strip" aria-label="Session">
    <div class="brand"><strong>JANUS</strong> <span class="muted">JNS.OS</span> · <svg class="wordmark" viewBox="0 0 206 40" role="img" aria-label="BLACKSITE" fill="none" stroke="currentColor"><rect x="1.5" y="1.5" width="203" height="37" stroke-width="3"/><g transform="translate(14 0)" stroke-width="5"><path d="M2.5 10V30M2.5 12.5H12A3.75 3.75 0 0 1 12 20H2.5M12 20A3.75 3.75 0 0 1 12 27.5H2.5"/><path transform="translate(23 0)" d="M2.5 10V27.5H16"/><path transform="translate(44 0)" d="M1 30L9 11L17 30"/><path transform="translate(66 0)" d="M17 12.5H9A7.5 7.5 0 0 0 9 27.5H17"/><path transform="translate(88 0)" d="M2.5 10V30M16 10L5 20L16 30"/><path transform="translate(110 0)" d="M16 12.5H6.25A3.75 3.75 0 0 0 6.25 20H11.75A3.75 3.75 0 0 1 11.75 27.5H2"/><path transform="translate(131 0)" d="M2.5 10V30"/><path transform="translate(141 0)" d="M0 12.5H16M8 12.5V30"/><path transform="translate(162 0)" d="M16 12.5H2.5V27.5H16M2.5 20H14"/></g></svg></div>
    <span class="tag lab">LAB · ISOLATED</span>
    <div id="session" class="session"></div>
  </header>
  <main id="app" tabindex="-1"><p class="muted">Loading…</p></main>
  <dialog id="stepup" aria-labelledby="stepup-title">
    <form id="stepup-form" method="dialog">
      <h2 id="stepup-title">Confirm it's you</h2>
      <p class="muted">BLACKSITE needs a two-factor code from the last 15 minutes.</p>
      <label>Authenticator code <input id="stepup-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></label>
      <p id="stepup-error" class="error" role="alert"></p>
      <div class="row end">
        <button type="button" id="stepup-cancel" class="ghost">Cancel</button>
        <button type="submit" class="primary">Confirm</button>
      </div>
    </form>
  </dialog>
</body>
</html>
