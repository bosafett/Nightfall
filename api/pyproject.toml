[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nightfall-api"
version = "0.1.0"
description = "NIGHTFALL API"
requires-python = ">=3.13"
dependencies = [
  "fastapi~=0.162.0",
  "uvicorn~=0.54.0",
  "pydantic~=2.14",
  "sqlalchemy~=2.1.8",
  "alembic~=1.20",
  "psycopg[binary]~=3.3",
  "argon2-cffi~=25.1",
  "pyotp~=2.10",
  "cryptography~=50.0",
]

[project.optional-dependencies]
dev = [
  "httpx~=0.28.1",      # FastAPI TestClient
  "pytest~=9.2",
  "ruff~=0.17.3",
  "mypy~=2.4",
  "pip-audit~=2.10",
]

[project.scripts]
nightfall-admin = "nightfall.cli:main"

[tool.setuptools.packages.find]
include = ["nightfall*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the idiom

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "SIM117"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["nightfall"]

[[tool.mypy.overrides]]
module = ["pyotp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
